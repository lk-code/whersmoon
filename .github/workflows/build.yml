name: Build

on:
  push:
  pull_request:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet test tests/WheresMoon.Core.Tests/WheresMoon.Core.Tests.csproj

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet workload install maui-windows
      - run: dotnet build src/WheresMoon.App/WheresMoon.App.csproj -f net10.0-windows10.0.19041.0 -c Release

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '21'
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet workload install maui-android
      - run: dotnet build src/WheresMoon.App/WheresMoon.App.csproj -f net10.0-android -c Release

  # Builds only prove that the code compiles and links: signing needs certificates that do not
  # belong in this repository, and a runner cannot show how the app looks on a device.
  apple:
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet workload install maui
      - name: Show Xcode
        run: xcodebuild -version
      - name: iOS simulator
        run: |
          dotnet build src/WheresMoon.App/WheresMoon.App.csproj -f net10.0-ios -c Debug -r iossimulator-arm64 -p:ValidateXcodeVersion=false 2>&1 | tee ios.log
      - name: Mac Catalyst
        run: |
          dotnet build src/WheresMoon.App/WheresMoon.App.csproj -f net10.0-maccatalyst -c Debug -p:ValidateXcodeVersion=false -p:EnableCodeSigning=false 2>&1 | tee mac.log
      # Job logs need a login to read, annotations do not.
      - name: Report build errors
        if: failure()
        run: |
          cat ios.log mac.log 2>/dev/null | grep -E ': error |error [A-Z]+[0-9]+|IL[0-9]{4}' | sort -u | cut -c1-400 | head -30 | sed 's/^/::error::/'
